name: PR Comment
description: PRにコメントを投稿し、同一タグの古いコメントを非表示にする（必要な権限: pull-requests: write）

inputs:
  issue-number:
    description: PR番号
    required: true
  body-path:
    description: コメント本文のファイルパス
    required: true
  comment-tag:
    description: コメントを識別するタグ
    required: true

runs:
  using: composite
  steps:
    - name: Post PR comment
      uses: actions/github-script@v7
      env:
        BODY_PATH: ${{ inputs.body-path }}
        COMMENT_TAG: ${{ inputs.comment-tag }}
        PR_NUMBER: ${{ inputs.issue-number }}
      with:
        script: |
          const fs = require("fs");
          const bodyPath = process.env.BODY_PATH;

          if (!bodyPath) {
            throw new Error("BODY_PATH が指定されていません。inputs.body-path を確認してください。");
          }

          if (!fs.existsSync(bodyPath)) {
            throw new Error(`コメント本文ファイルが見つかりませんでした: ${bodyPath}`);
          }

          let body;
          try {
            body = fs.readFileSync(bodyPath, "utf8");
          } catch (error) {
            throw new Error(`コメント本文ファイルの読み込みに失敗しました: ${bodyPath} (${error.message})`);
          }
          const tag = `<!-- ${process.env.COMMENT_TAG} -->`;
          const rawPrNumber = process.env.PR_NUMBER;

          if (!rawPrNumber || !/^\d+$/.test(rawPrNumber)) {
            throw new Error(
              `環境変数 PR_NUMBER が不正です。数値の PR 番号を指定してください（受け取った値: "${String(rawPrNumber)}"）。`
            );
          }

          const prNumber = Number(rawPrNumber);

          const comments = await github.paginate(
            github.rest.issues.listComments,
            {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            }
          );

          for (const comment of comments) {
            if (comment.body && comment.body.includes(tag)) {
              try {
                await github.graphql(`
                  mutation($id: ID!) {
                    minimizeComment(input: { subjectId: $id, classifier: OUTDATED }) {
                      minimizedComment { isMinimized }
                    }
                  }
                `, { id: comment.node_id });
              } catch (error) {
                console.warn(
                  `Failed to minimize comment (id=${comment.id}, node_id=${comment.node_id}):`,
                  error
                );
              }
            }
          }

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
            body: `${body}\n${tag}`,
          });
