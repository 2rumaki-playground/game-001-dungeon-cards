name: PR Comment
description: PRにコメントを投稿し、同一タグの古いコメントを非表示にする

inputs:
  issue-number:
    description: PR番号
    required: true
  body-path:
    description: コメント本文のファイルパス
    required: true
  comment-tag:
    description: コメントを識別するタグ
    required: true

runs:
  using: composite
  steps:
    - name: Post PR comment
      uses: actions/github-script@v7
      env:
        BODY_PATH: ${{ inputs.body-path }}
        COMMENT_TAG: ${{ inputs.comment-tag }}
        PR_NUMBER: ${{ inputs.issue-number }}
      with:
        script: |
          const fs = require("fs");
          const body = fs.readFileSync(process.env.BODY_PATH, "utf8");
          const tag = `<!-- ${process.env.COMMENT_TAG} -->`;
          const prNumber = Number(process.env.PR_NUMBER);

          const comments = await github.paginate(
            github.rest.issues.listComments,
            {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            }
          );

          for (const comment of comments) {
            if (comment.body && comment.body.includes(tag)) {
              await github.graphql(`
                mutation($id: ID!) {
                  minimizeComment(input: { subjectId: $id, classifier: OUTDATED }) {
                    minimizedComment { isMinimized }
                  }
                }
              `, { id: comment.node_id });
            }
          }

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
            body: `${body}\n${tag}`,
          });
